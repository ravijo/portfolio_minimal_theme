name: 'Portfolio Minimal Theme'
type: theme
description: 'A responsive theme originally designed for Drupal 7, now upgraded for Drupal 10/11.'
base theme: false
core_version_requirement: ^10 || ^11
version: '2.0'

# Assets
favicon: favicon.ico
screenshot: screenshot.png
logo: logo.svg

# Libraries
libraries:
  - portfolio_minimal_theme/global-styling
  - portfolio_minimal_theme/global-scripts

# Regions
regions:
  page_top: 'Page top'
  main_menu: 'Main menu'
  breadcrumb: 'Breadcrumb'
  content: 'Content'
  sidebar_first: 'First Sidebar'
  sidebar_second: 'Second Sidebar'
  aboutme: 'About me'
  recent_news: 'Recent news'
  myworks: 'My works'
  keyskills: 'Key skills'
  education: 'Education'
  awards: 'Awards'
  resume: 'Resume'
  contact: 'Contact'
  page_bottom: 'Page bottom'

# Features (only keep what works in D10/11)
features:
  - logo
  - favicon
  - name
  - slogan
