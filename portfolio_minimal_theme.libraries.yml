global-styling:
  version: 1.0
  css:
    theme:
      css/font-awesome.css: {}
      css/style.css: {}
      css/media.css: {}
  dependencies:
    - core/drupal
    - portfolio_minimal_theme/animate

global-scripts:
  version: 1.0
  js:
    js/wow.min.js: {}
    js/custom.js: { dependencies: ['portfolio_minimal_theme/wow-js'] }
  dependencies:
    - core/jquery
    - core/drupal

wow-js:
  version: 1.0.2
  js:
    js/wow.min.js: {}

animate:
  version: 4.1.1
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css:
        type: external
        minified: true
