global-styling:
  version: 1.0
  css:
    theme:
      css/style.css: {}
      css/media.css: {}
  dependencies:
    - core/drupal
    - portfolio_minimal_theme/animate
    - portfolio_minimal_theme/font-awesome

global-scripts:
  version: 1.0
  js:
    js/custom.js:
      attributes:
        defer: true
  dependencies:
    - core/jquery
    - core/drupal
    - portfolio_minimal_theme/wow-js

wow-js:
  version: 1.1.2
  js:
    https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js:
      type: external
      minified: true
      attributes:
        defer: true

animate:
  version: 4.1.1
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css:
        type: external
        minified: true

font-awesome:
  version: 7.0.1
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css:
        type: external
        minified: true
