global-styling:
  version: 1.0
  css:
    theme:
      css/style.css: {}
      css/media.css: {}
  dependencies:
    - core/drupal
    - portfolio_minimal_theme/animate
    - portfolio_minimal_theme/font-awesome

global-scripts:
  version: 1.0
  js:
    js/wow.min.js: {}
    js/custom.js: { dependencies: ['portfolio_minimal_theme/wow-js'] }
  dependencies:
    - core/jquery
    - core/drupal

wow-js:
  version: 1.0.2
  js:
    js/wow.min.js: {}

animate:
  version: 4.1.1
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css:
        type: external
        minified: true

font-awesome:
  version: 7.0.1
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css:
        type: external
        minified: true
